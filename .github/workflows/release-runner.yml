name: Publish runner images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimal
            lock: containers/profiles/minimal.lock
          - profile: scientific
            lock: containers/requirements.lock
          - profile: web
            lock: containers/profiles/web.lock

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local qualification candidate
        run: |
          docker build \
            --build-arg RUNNER_PROFILE=${{ matrix.profile }} \
            --build-arg REQUIREMENTS_LOCK=${{ matrix.lock }} \
            -f containers/Dockerfile \
            -t pyfixagent-runner:release-candidate-${{ matrix.profile }} .

      - name: Smoke-test profile before publication
        run: |
          IMPORTS=$(python -c "import json; print(','.join(json.load(open('containers/profiles.json'))['profiles']['${{ matrix.profile }}']['smoke_imports']))")
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --cap-drop ALL --security-opt no-new-privileges:true --user 65534:65534 \
            pyfixagent-runner:release-candidate-${{ matrix.profile }} \
            python -c "import $IMPORTS"

      - name: Exercise scientific sandbox policy before publication
        if: matrix.profile == 'scientific'
        env:
          RUN_CONTAINER_TESTS: "1"
          RUN_CONTAINER_ENGINE: docker
          RUN_CONTAINER_IMAGE: pyfixagent-runner:release-candidate-scientific
        run: |
          pip install -e .
          pytest tests/test_bounded_process.py tests/test_container_sandbox.py -q

      - name: Reject application-layer Critical or High CVEs before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: pyfixagent-runner:release-candidate-${{ matrix.profile }}
          vuln-type: library
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          version: v0.70.0

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/pyfixagent-runner
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}-${{ matrix.profile }}
            type=semver,pattern={{version}},enable=${{ matrix.profile == 'scientific' }}

      - name: Build and publish signed-subject runner
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUNNER_PROFILE=${{ matrix.profile }}
            REQUIREMENTS_LOCK=${{ matrix.lock }}
          provenance: mode=max
          sbom: true

      - name: Sign build provenance with GitHub OIDC
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/pyfixagent-runner
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
